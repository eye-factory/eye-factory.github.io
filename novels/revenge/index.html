<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>復讐の館 - 目次 | eye-factory</title>
    <meta name="description" content="短編小説シリーズ「復讐の館」目次ページ。信頼していた上司に裏切られた男の復讐劇。">
    <link rel="icon" type="image/png" href="../../favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080808;
            --bg-darker: #040404;
            --bg-card: rgba(12, 8, 8, 0.95);
            --text: #d8d8d8;
            --text-dim: #a0a0a0;
            --text-muted: #606060;
            --blood: #8b0000;
            --blood-bright: #cc0000;
            --blood-dark: #4a0000;
            --blood-glow: rgba(139, 0, 0, 0.6);
            --border: rgba(80, 0, 0, 0.4);
            --font-body: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
            --font-serif: 'Noto Serif JP', 'Yu Mincho', serif;
            --transition: 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            line-height: 1.8;
            min-height: 100vh;
        }

        /* Dark Vignette Background */
        .bg-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            background:
                radial-gradient(ellipse at 50% 50%, transparent 0%, rgba(0, 0, 0, 0.4) 70%, rgba(0, 0, 0, 0.8) 100%),
                radial-gradient(ellipse at 20% 80%, rgba(60, 0, 0, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(40, 0, 0, 0.1) 0%, transparent 40%),
                var(--bg);
        }

        /* Blood Drip Effect */
        .blood-drip {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(180deg, var(--blood) 0%, transparent 100%);
            z-index: 99;
        }

        .blood-drip::before,
        .blood-drip::after {
            content: '';
            position: absolute;
            top: 0;
            background: var(--blood);
            border-radius: 0 0 50% 50%;
        }

        .blood-drip::before {
            left: 25%;
            width: 5px;
            height: 30px;
            animation: drip 4s ease-in-out infinite;
        }

        .blood-drip::after {
            left: 65%;
            width: 4px;
            height: 20px;
            animation: drip 5s ease-in-out infinite 1.5s;
        }

        @keyframes drip {
            0%, 100% { height: 20px; opacity: 0.8; }
            50% { height: 40px; opacity: 1; }
        }

        /* Header */
        .header {
            position: fixed;
            top: 8px;
            left: 0;
            right: 0;
            padding: 1rem 2rem;
            background: rgba(4, 4, 4, 0.95);
            border-bottom: 1px solid var(--border);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-logo {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.9rem;
            opacity: 0.7;
            transition: var(--transition);
        }

        .header-logo:hover {
            opacity: 1;
            color: var(--blood-bright);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 7rem 1.5rem 4rem;
        }

        /* Cover Image */
        .cover-wrapper {
            width: 100%;
            margin-bottom: 3rem;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.8),
                0 0 60px rgba(139, 0, 0, 0.2);
        }

        .cover-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 2px solid transparent;
            border-image: linear-gradient(135deg, var(--blood) 0%, transparent 50%, var(--blood-dark) 100%) 1;
            pointer-events: none;
            z-index: 1;
        }

        .cover-image {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            filter: brightness(0.9) contrast(1.1);
        }

        .cover-placeholder {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, #0c0808 0%, #080404 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            border: 1px solid var(--border);
        }

        /* Title Section with Blood Splatter */
        .title-section {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            position: relative;
        }

        .title-section::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--blood), transparent);
        }

        .series-title {
            font-family: var(--font-serif);
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 700;
            letter-spacing: 0.15em;
            margin-bottom: 1.5rem;
            color: var(--text);
            position: relative;
            display: inline-block;
        }

        .series-title::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 150%;
            background:
                radial-gradient(ellipse 8px 12px at 10% 30%, var(--blood) 0%, transparent 70%),
                radial-gradient(ellipse 6px 8px at 85% 25%, var(--blood-dark) 0%, transparent 70%),
                radial-gradient(ellipse 10px 6px at 90% 70%, var(--blood) 0%, transparent 70%),
                radial-gradient(ellipse 5px 10px at 5% 75%, var(--blood-dark) 0%, transparent 70%),
                radial-gradient(ellipse 4px 4px at 30% 10%, var(--blood-bright) 0%, transparent 70%),
                radial-gradient(ellipse 3px 6px at 70% 85%, var(--blood) 0%, transparent 70%);
            opacity: 0.7;
            z-index: -1;
            filter: blur(1px);
        }

        .series-description {
            color: var(--text-dim);
            font-size: 1rem;
            line-height: 1.8;
            max-width: 600px;
            margin: 0 auto;
        }

        /* TOC Section */
        .toc-section {
            margin-top: 3rem;
        }

        .toc-title {
            font-size: 1.2rem;
            color: var(--text-dim);
            margin-bottom: 1.5rem;
            letter-spacing: 0.1em;
            position: relative;
            display: inline-block;
        }

        .toc-title::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, var(--blood), transparent);
        }

        .episode-list {
            list-style: none;
        }

        .episode-item {
            margin-bottom: 1rem;
        }

        .episode-link {
            display: block;
            padding: 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            text-decoration: none;
            color: var(--text);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .episode-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(139, 0, 0, 0.15), transparent);
            transition: 0.5s;
        }

        .episode-link:hover::before {
            left: 100%;
        }

        .episode-link:hover {
            background: rgba(139, 0, 0, 0.1);
            border-color: var(--blood);
            transform: translateX(4px);
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.2);
        }

        /* Blood spot decoration on episode cards */
        .episode-link::after {
            content: '';
            position: absolute;
            top: 10px;
            right: 15px;
            width: 6px;
            height: 6px;
            background: var(--blood);
            border-radius: 50%;
            opacity: 0.6;
        }

        .episode-number {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .episode-title-text {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .chapter-list {
            margin-top: 0.8rem;
            padding-left: 1rem;
            font-size: 0.9rem;
            color: var(--text-dim);
            list-style: none;
        }

        .chapter-list li {
            margin-bottom: 0.3rem;
            position: relative;
            padding-left: 1rem;
        }

        .chapter-list li::before {
            content: '†';
            position: absolute;
            left: 0;
            color: var(--blood);
            opacity: 0.6;
            font-size: 0.8rem;
        }

        .coming-soon {
            opacity: 0.4;
            pointer-events: none;
        }

        .coming-soon .episode-link {
            cursor: not-allowed;
        }

        .coming-soon .episode-link::after {
            display: none;
        }

        .badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            background: rgba(139, 0, 0, 0.25);
            border: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-left: 0.5rem;
        }

        /* Footer */
        .footer {
            margin-top: 4rem;
            padding: 2rem;
            text-align: center;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.85rem;
            position: relative;
        }

        .footer::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 30%;
            width: 40%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--blood), transparent);
        }

        .footer a {
            color: var(--text-dim);
            text-decoration: none;
            transition: var(--transition);
        }

        .footer a:hover {
            color: var(--blood-bright);
        }

        @media (max-width: 768px) {
            .container {
                padding: 6rem 1rem 3rem;
            }

            .header {
                padding: 0.8rem 1rem;
            }

            .series-title::before {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="bg-effect"></div>
    <div class="blood-drip"></div>

    <header class="header">
        <a href="../../index.html" class="header-logo">eye-factory</a>
    </header>

    <main class="container">
        <div class="cover-wrapper">
            <img src="revenge_cover.png" alt="復讐の館 表紙" class="cover-image"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="cover-placeholder" style="display:none;">表紙画像 (revenge_cover.png)</div>
        </div>

        <section class="title-section">
            <h1 class="series-title">復讐の館</h1>
            <p class="series-description">
                信頼していた上司に裏切られ、すべてを失った男。<br>
                闇に堕ちた彼が辿り着いた先には、奇妙な「館」があった——。
            </p>
        </section>

        <section class="toc-section">
            <h2 class="toc-title">目次</h2>
            <ul class="episode-list">
                <li class="episode-item">
                    <a href="chapter1.html" class="episode-link">
                        <div class="episode-number">1人目</div>
                        <div class="episode-title-text">「運が悪かった、ただそれだけだ」</div>
                        <ul class="chapter-list">
                            <li>第一章</li>
                        </ul>
                    </a>
                </li>
                <li class="episode-item coming-soon">
                    <a href="#" class="episode-link">
                        <div class="episode-number">2人目 <span class="badge">Coming Soon</span></div>
                        <div class="episode-title-text">——</div>
                    </a>
                </li>
            </ul>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; eye-factory. All rights reserved.</p>
        <p><a href="../../index.html">eye-factory トップへ戻る</a></p>
    </footer>
</body>
</html>
